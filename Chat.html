<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chat</title>
  <style>
    body { 
      font-family: sans-serif; 
      margin: 0; 
      padding: 0; 
      background: #f0f2f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 15px;
      text-align: center;
      font-weight: bold;
      font-size: 18px;
    }
    #chat { 
      flex: 1;
      overflow-y: auto; 
      padding: 15px;
    }
    .msg { 
      margin: 10px 0; 
      padding: 12px 15px; 
      border-radius: 18px; 
      max-width: 80%; 
      word-wrap: break-word;
      animation: fadeIn 0.3s;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .user { 
      background: #0084ff; 
      color: white; 
      margin-left: auto;
      border-bottom-right-radius: 4px;
    }
    .ai { 
      background: white; 
      margin-right: auto;      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }
    #input-area {
      display: flex;
      padding: 10px;
      background: white;
      border-top: 1px solid #ddd;
    }
    #input { 
      flex: 1;
      padding: 12px 15px; 
      border-radius: 25px; 
      border: 1px solid #ddd;
      font-size: 16px;
      outline: none;
    }
    #send-btn { 
      padding: 12px 25px; 
      margin-left: 10px;
      border-radius: 25px; 
      border: none; 
      background: #0084ff; 
      color: white;
      font-weight: bold;
    }
    #loading {
      padding: 10px;
      text-align: center;
      color: #666;
      display: none;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div id="header">💬 AI Chat - Free & No Key</div>
  <div id="chat"></div>
  <div id="loading">AI is typing...</div>
  <div id="input-area">
    <input type="text" id="input" placeholder="Type a message..." autocomplete="off">
    <button id="send-btn" onclick="send()">Send</button>
  </div>

  <script>
    let chatHistory = JSON.parse(localStorage.getItem('myChat')) || [];
    
    function render() {
      const chatDiv = document.getElementById('chat');
      chatDiv.innerHTML = chatHistory.map(msg =>         `<div class="msg ${msg.role}">${escapeHtml(msg.content)}</div>`
      ).join('');
      chatDiv.scrollTop = chatDiv.scrollHeight;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function save() {
      localStorage.setItem('myChat', JSON.stringify(chatHistory));
    }

    async function send() {
      const input = document.getElementById('input');
      const text = input.value.trim();
      if (!text) return;

      // Add user message
      chatHistory.push({ role: 'user', content: text });
      save();
      render();
      input.value = '';
      
      // Show loading
      document.getElementById('loading').style.display = 'block';

      try {
        // Build context from last 15 messages for memory
        const context = chatHistory.slice(-15).map(m => {
          const role = m.role === 'user' ? 'User' : 'Assistant';
          return `${role}: ${m.content}`;
        }).join('\n');

        // Call Pollinations AI API (FREE, no key needed)
        const response = await fetch('https://text.pollinations.ai/', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            messages: [
              { role: 'system', content: 'You are a helpful assistant with memory. Remember details about the user.' },
              { role: 'user', content: context }
            ],
            model: 'qwen',
            seed: Math.floor(Math.random() * 1000)
          })        });

        const aiText = await response.text();
        
        // Add AI response
        chatHistory.push({ role: 'ai', content: aiText });
        save();
        render();
      } catch (error) {
        alert('Error: ' + error.message);
        console.error(error);
      }
      
      document.getElementById('loading').style.display = 'none';
    }

    // Allow Enter key
    document.getElementById('input').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') send();
    });

    // Initial render
    render();
    console.log('Chat loaded with', chatHistory.length, 'messages');
  </script>
</body>
</html>
