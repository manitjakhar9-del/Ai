<!DOCTYPE html>
<html lang="en" class="">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manit AI</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class'}</script>
</head>

<body class="flex h-screen bg-white dark:bg-gray-900">

<div class="flex w-full">

<!-- SIDEBAR -->
<aside class="w-64 bg-gray-100 dark:bg-gray-800 p-3 flex flex-col">
<button id="newChat" class="bg-blue-500 text-white p-2 rounded mb-3">New Chat</button>
<div id="chatList" class="flex-1 space-y-2 overflow-y-auto"></div>
</aside>

<!-- CHAT -->
<div class="flex flex-col flex-1">
<div id="chatWindow" class="flex-1 p-4 overflow-y-auto">
<ul id="messages" class="space-y-2"></ul>
</div>

<div class="flex p-3 border-t dark:border-gray-700">
<textarea id="input" class="flex-1 p-2 rounded bg-gray-200 dark:bg-gray-800 text-black dark:text-white"></textarea>
<button id="send" class="bg-blue-500 px-5 ml-2 rounded text-white">Send</button>
</div>
</div>
</div>

<script>
const API = "https://ai-mup4.onrender.com/chat";
const messages = document.getElementById("messages");
const chatList = document.getElementById("chatList");
let chats = JSON.parse(localStorage.getItem("chats") || "{}");
let current = localStorage.getItem("current") || null;

if(!current){
 current = Date.now().toString();
 chats[current]=[];
 localStorage.setItem("current",current);
 save();
}
renderChats();
loadChat();

function save(){
 localStorage.setItem("chats",JSON.stringify(chats));
}

function renderChats(){
 chatList.innerHTML="";
 for(let id in chats){
  let b=document.createElement("button");
  b.textContent="Chat "+id.slice(-4);
  b.className="w-full bg-gray-300 dark:bg-gray-700 p-2 rounded";
  b.onclick=()=>{current=id; localStorage.setItem("current",id); loadChat();};
  chatList.appendChild(b);
 }
}

function loadChat(){
 messages.innerHTML="";
 chats[current].forEach(m=>add(m.text,m.role,false));
}

function add(text,role,saveIt=true){
 let li=document.createElement("li");
 li.className=role=="user"?"text-right":"text-left";
 let b=document.createElement("div");
 b.className=(role=="user"?"bg-blue-500 text-white":"bg-gray-300 dark:bg-gray-700")+" inline-block p-2 rounded";
 b.textContent=text;
 li.appendChild(b);
 messages.appendChild(li);
 if(saveIt){
   chats[current].push({role,text});
   save();
 }
 document.getElementById("chatWindow").scrollTop=99999;
}

document.getElementById("send").onclick=async()=>{
 let msg=input.value.trim();
 if(!msg) return;
 add(msg,"user");
 input.value="";
 let r=await fetch(API,{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({session_id:current,message:msg})
 });
 let d=await r.json();
 add(d.reply,"bot");
};

document.getElementById("newChat").onclick=()=>{
 current=Date.now().toString();
 chats[current]=[];
 localStorage.setItem("current",current);
 save();
 renderChats();
 loadChat();
};
</script>

</body>
</html>
