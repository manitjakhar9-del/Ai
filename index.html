<!DOCTYPE html>
<html>
<head>
<title>Manit AI</title>
<style>
body{
  background:#0b1120;
  margin:0;
  font-family:Arial;
  display:flex;
  flex-direction:column;
  height:100vh;
}
#chat{
  flex:1;
  overflow-y:auto;
  padding:10px;
}
.msg{
  max-width:80%;
  padding:10px;
  margin:6px;
  border-radius:10px;
}
.user{
  background:#2563eb;
  color:white;
  margin-left:auto;
}
.bot{
  background:#1f2937;
  color:white;
}
#bar{
  display:flex;
  padding:10px;
  background:#020617;
}
input{
  flex:1;
  padding:10px;
  border:none;
  border-radius:6px;
}
button{
  margin-left:10px;
  background:#22c55e;
  border:none;
  padding:10px 16px;
  border-radius:6px;
  color:black;
  font-weight:bold;
}
</style>
</head>
<body>

<div id="chat"></div>

<div id="bar">
  <input id="text" placeholder="Message Manit AI..." />
  <button onclick="send()">Send</button>
</div>

<script>
function add(text,type){
  let d=document.createElement("div");
  d.className="msg "+type;
  d.innerText=text;
  document.getElementById("chat").appendChild(d);
  document.getElementById("chat").scrollTop=99999;
}

async function send(){
  let msg=document.getElementById("text").value;
  if(!msg) return;
  document.getElementById("text").value="";
  add(msg,"user");

  let r=await fetch("https://ai-mup4.onrender.com/chat",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({message:msg})
  });

  let data=await r.json();
  add(data.reply,"bot");
}
</script>

</body>
</html>
