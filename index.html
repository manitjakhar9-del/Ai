<!DOCTYPE html>
<html lang="en" class="">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manit AI Chat Interface</title>
  <!-- Tailwind CSS via CDN with class-based dark mode -->
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex h-screen antialiased bg-white dark:bg-gray-900 transition-colors duration-300">
  <div class="flex w-full">
    <!-- Sidebar -->
    <aside class="flex flex-col w-64 border-r border-gray-200 dark:border-gray-700 bg-gray-100 dark:bg-gray-800">
      <div class="flex-none p-4">
        <button id="newChatBtn" class="w-full px-4 py-2 bg-blue-500 hover:bg-blue-600 text-white rounded transition">
          New Chat
        </button>
      </div>
      <div class="flex-1 overflow-y-auto px-2">
        <ul id="chatList" class="space-y-2">
          <!-- Example chat history items -->
          <li class="px-3 py-2 bg-white dark:bg-gray-700 rounded hover:bg-gray-200 dark:hover:bg-gray-600 cursor-pointer">Chat with Alice</li>
          <li class="px-3 py-2 bg-white dark:bg-gray-700 rounded hover:bg-gray-200 dark:hover:bg-gray-600 cursor-pointer">Project Ideas</li>
          <li class="px-3 py-2 bg-white dark:bg-gray-700 rounded hover:bg-gray-200 dark:hover:bg-gray-600 cursor-pointer">Next Vacation</li>
        </ul>
      </div>
      <div class="flex-none p-4 border-t border-gray-200 dark:border-gray-700">
        <button id="themeToggle" class="flex items-center w-full px-4 py-2 bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-100 rounded hover:bg-gray-300 dark:hover:bg-gray-600 transition">
          <!-- Emoji icons for light/dark -->
          <span id="themeIcon" class="mr-2">🌙</span>
          <span id="themeText">Dark Mode</span>
        </button>
      </div>
    </aside>

    <!-- Main Chat Area -->
    <main class="flex flex-col flex-1">
      <!-- Chat Messages -->
      <div id="chatWindow" class="flex-1 p-4 overflow-y-auto space-y-4 bg-white dark:bg-gray-900 transition-colors duration-300">
        <!-- Example initial messages -->
        <ul id="messageList" class="space-y-2">
          <li class="flex items-start">
            <div class="bg-gray-200 dark:bg-gray-700 text-gray-900 dark:text-gray-100 px-4 py-2 rounded-lg max-w-xs">
              Hello! I am Manit AI. How can I assist you today?
            </div>
          </li>
          <li class="flex justify-end">
            <div class="bg-blue-500 text-white px-4 py-2 rounded-lg max-w-xs">
              Can you explain what AI is?
            </div>
          </li>
          <li class="flex items-start">
            <div class="bg-gray-200 dark:bg-gray-700 text-gray-900 dark:text-gray-100 px-4 py-2 rounded-lg max-w-xs">
              Certainly! Artificial Intelligence (AI) refers to the simulation of human intelligence in machines...
            </div>
          </li>
        </ul>
      </div>
      <!-- Input Bar -->
      <div class="flex items-center p-4 border-t border-gray-200 dark:border-gray-700">
        <textarea id="chatInput" rows="1" class="flex-1 border border-gray-300 dark:border-gray-600 px-4 py-2 rounded-lg resize-none focus:outline-none focus:ring focus:border-blue-300 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 transition-colors duration-200" placeholder="Type a message..."></textarea>
        <button id="sendBtn" class="ml-2 px-6 py-2 bg-blue-500 hover:bg-blue-600 text-white rounded-lg transition">
          Send
        </button>
      </div>
    </main>
  </div>

  <script>
    // Dark mode toggle: use localStorage + prefers-color-scheme (per Tailwind docs)
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    const themeText = document.getElementById('themeText');

    function updateThemeUI(isDark) {
      if (isDark) {
        themeIcon.textContent = '☀️';
        themeText.textContent = 'Light Mode';
      } else {
        themeIcon.textContent = '🌙';
        themeText.textContent = 'Dark Mode';
      }
    }
    // On load, set theme from localStorage or system
    const userPrefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    let isDark = (localStorage.theme === 'dark') || (!('theme' in localStorage) && userPrefersDark);
    document.documentElement.classList.toggle('dark', isDark);
    updateThemeUI(isDark);

    themeToggle.addEventListener('click', () => {
      isDark = !isDark;
      document.documentElement.classList.toggle('dark', isDark);
      localStorage.theme = isDark ? 'dark' : 'light';
      updateThemeUI(isDark);
    });

    // Chat functionality
    const messageList = document.getElementById('messageList');
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');
    const newChatBtn = document.getElementById('newChatBtn');

    // Function to append a message bubble
    function appendMessage(text, isUser) {
      const li = document.createElement('li');
      li.className = isUser ? 'flex justify-end' : 'flex items-start';
      const bubble = document.createElement('div');
      bubble.className = (isUser 
        ? 'bg-blue-500 text-white' 
        : 'bg-gray-200 dark:bg-gray-700 text-gray-900 dark:text-gray-100') + ' px-4 py-2 rounded-lg max-w-xs';
      bubble.textContent = text;
      li.appendChild(bubble);
      messageList.appendChild(li);
      // Scroll to bottom
      chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    // Send button click handler
    sendBtn.addEventListener('click', async () => {
      const userText = chatInput.value.trim();
      if (!userText) return;
      appendMessage(userText, true);
      chatInput.value = '';
      // Call API
      try {
        const response = await fetch('https://ai-mup4.onrender.com/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: userText })
        });
        const data = await response.json();
        // Assume response has a 'reply' field
        const reply = data.reply || 'Error: No response';
        appendMessage(reply, false);
      } catch (err) {
        appendMessage('Error: Could not reach server.', false);
        console.error(err);
      }
    });

    // New Chat button clears the chat
    newChatBtn.addEventListener('click', () => {
      messageList.innerHTML = '';
    });
  </script>
</body>
</html>
