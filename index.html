<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manit AI</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 text-white h-screen flex">

<!-- Sidebar -->
<div class="w-20 bg-gray-800 flex flex-col items-center py-4 space-y-4">
  <button onclick="newChat()" class="bg-blue-600 px-3 py-2 rounded text-sm">New</button>
</div>

<!-- Chat -->
<div class="flex-1 flex flex-col">

<div id="chat" class="flex-1 overflow-y-auto p-4 space-y-3"></div>

<div class="p-3 flex bg-gray-800">
  <input id="msg" class="flex-1 bg-gray-700 p-2 rounded text-white" placeholder="Type..." />
  <button onclick="send()" class="bg-blue-600 px-4 ml-2 rounded">Send</button>
</div>

</div>

<script>
const API = "https://ai-mup4.onrender.com/chat";

let sessionId = localStorage.getItem("session_id");
if(!sessionId){
  sessionId = "chat_" + Math.random().toString(36).substring(2,12);
  localStorage.setItem("session_id", sessionId);
}

function add(text, me=false){
  const div=document.createElement("div");
  div.className = me?"text-right":"text-left";
  div.innerHTML = `<span class="inline-block px-3 py-2 rounded ${me?"bg-blue-600":"bg-gray-700"}">${text}</span>`;
  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;
}

async function send(){
  const t = msg.value.trim();
  if(!t) return;
  add(t,true);
  msg.value="";

  const res = await fetch(API,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      session_id: sessionId,
      message: t
    })
  });

  const data = await res.json();
  add(data.reply || "Error");
}

function newChat(){
  sessionId = "chat_" + Math.random().toString(36).substring(2,12);
  localStorage.setItem("session_id", sessionId);
  chat.innerHTML="";
  add("New chat started.");
}
</script>

</body>
</html>
